# ==============================================================================
# RouteFlow Database Configuration (Oracle Database + SQLite Fallback)
# ==============================================================================
# Database Mode:
# 'AUTO'   : Tries connecting to Oracle DB first; seamlessly falls back to SQLite if Oracle is offline.
# 'ORACLE' : Force Oracle Database connection.
# 'SQLITE' : Force local SQLite database.
db.mode=AUTO

# Oracle Database Connection Settings
# Compatible with Oracle 11g, 12c, 18c, 19c, 21c, and 23c Free
oracle.host=localhost
oracle.port=1521

# Specify either Service Name (recommended for pluggable DBs) or SID:
# For Oracle 23c Free: FREEPDB1
# For Oracle 21c/18c XE: XEPDB1
# For traditional SID: XE or ORCL
oracle.service=FREEPDB1
oracle.sid=

# Oracle Database Credentials
oracle.user=SYSTEM
oracle.password=password

# SQLite Database File (Fallback)
sqlite.file=delivery.db
